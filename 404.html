<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101211">
  <meta name="robots" content="noindex">
  <title>Страница не найдена — VENTO AUTO ATELIER</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/fonts.css?v=2">
  <style>
    :root{--bg:#101211;--ivory:#f1f3ed;--muted:#f1f3eda6;--accent:#d4c19f;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ivory);font-family:Manrope,system-ui,sans-serif;text-align:center}
    .mark{font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:clamp(72px,24vw,200px);line-height:1;letter-spacing:-.04em;color:var(--accent)}
    h1{margin:24px 0 8px;font-size:clamp(26px,6vw,40px);font-weight:600;letter-spacing:-.03em;text-wrap:balance}
    p{margin:0 0 32px;color:var(--muted);font-size:17px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--ivory);color:var(--bg);font-weight:600;text-decoration:none}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="mark" aria-hidden="true">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела. Всё о детейлинге VENTO на главной.</p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
